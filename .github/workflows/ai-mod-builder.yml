name: Build MCL AI Fabric mod JAR

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request identifier
        required: true
        type: string
      source_payload:
        description: Base64 encoded generated source project
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mcl-ai-mod-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted builder definition
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Materialize generated project safely
        env:
          SOURCE_PAYLOAD: ${{ inputs.source_payload }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          root = pathlib.Path("generated").resolve()
          root.mkdir()
          data = json.loads(base64.b64decode(os.environ["SOURCE_PAYLOAD"], validate=True))
          files = data.get("files") or []
          if not files or len(files) > 120:
              raise SystemExit("Invalid generated file list")
          total = 0
          for item in files:
              relative = pathlib.PurePosixPath(item["path"])
              if relative.is_absolute() or ".." in relative.parts or not relative.parts:
                  raise SystemExit(f"Unsafe generated path: {relative}")
              content = item.get("content", "")
              total += len(content.encode())
              if total > 50000:
                  raise SystemExit("Generated source is too large")
              target = (root / pathlib.Path(*relative.parts)).resolve()
              if root not in target.parents:
                  raise SystemExit(f"Escaping generated path: {relative}")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")
          required = [root / "settings.gradle", root / "build.gradle"]
          alternatives = [root / "settings.gradle.kts", root / "build.gradle.kts"]
          if not (required[0].is_file() or alternatives[0].is_file()):
              raise SystemExit("Generated project has no Gradle settings file")
          if not (required[1].is_file() or alternatives[1].is_file()):
              raise SystemExit("Generated project has no Gradle build file")
          PY

      - name: Compile generated mod
        id: compile
        continue-on-error: true
        working-directory: generated
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace build 2>&1 | tee ../build.log

      - name: Collect distributable JAR
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          mkdir -p output
          mapfile -t jars < <(find generated/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar')
          test "${#jars[@]}" -gt 0
          cp "${jars[0]}" "output/mcl-ai-mod-${{ inputs.request_id }}.jar"

      - name: Publish JAR or failure log for the launcher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="ai-build-${{ inputs.request_id }}"
          if [ "${{ steps.compile.outcome }}" = "success" ]; then
            gh release create "$TAG" output/*.jar build.log --title "MCL AI mod ${{ inputs.request_id }}" --notes "Generated by the opt-in MCLauncher trusted builder. Review generated source before distributing the mod."
          else
            gh release create "$TAG" build.log --title "MCL AI mod build failed ${{ inputs.request_id }}" --notes "Compilation failed. Download build.log for diagnostics."
            exit 1
          fi
