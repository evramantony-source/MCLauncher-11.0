name: Build standalone MCLauncher 11 APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Android CPU architecture
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      microsoft_accounts:
        description: Build with the private signer and enable Microsoft/Game Pass accounts
        required: true
        default: false
        type: boolean
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: mclauncher-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out MCLauncher
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run source, vendoring and JVM tests
        shell: bash
        run: |
          openssl version
          python3 scripts/source_sanity.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          gradle --no-daemon :core-model:test :core-minecraft:test :app:testDebugUnitTest

  build:
    name: Build ${{ inputs.abi || 'arm64-v8a' }} standalone APK
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      TARGET_ABI: ${{ inputs.abi || 'arm64-v8a' }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      PRIVATE_ACCOUNT_BUILD: ${{ inputs.microsoft_accounts || 'false' }}
      PRIVATE_SIGNING_KEY_BASE64: ${{ secrets.MCLAUNCHER_SIGNING_KEY_BASE64 }}
      MCLAUNCHER_SIGNING_STORE_PASSWORD: ${{ secrets.MCLAUNCHER_SIGNING_STORE_PASSWORD }}
      MCLAUNCHER_SIGNING_KEY_ALIAS: ${{ secrets.MCLAUNCHER_SIGNING_KEY_ALIAS }}
      MCLAUNCHER_SIGNING_KEY_PASSWORD: ${{ secrets.MCLAUNCHER_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Check out MCLauncher
        uses: actions/checkout@v4

      - name: Read pinned engine commit
        id: engine_lock
        shell: bash
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("vendor/engine-lock.json"))["engine"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchains
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "ndk;28.2.13676358" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Build pinned OpenLTW with Minecraft 26.2 compatibility
        shell: bash
        run: |
          LTW_COMMIT="$(python3 -c 'import json; print(json.load(open("vendor/engine-lock.json"))["renderers"]["openLTW"]["commit"])')"
          rm -rf .vendor-build/LTW
          mkdir -p .vendor-build
          git clone --filter=blob:none --no-checkout https://github.com/MojoLauncher/LTW.git .vendor-build/LTW
          cd .vendor-build/LTW
          git fetch --depth 1 origin "$LTW_COMMIT"
          git checkout --detach "$LTW_COMMIT"
          test "$(git rev-parse HEAD)" = "$LTW_COMMIT"
          git apply "$GITHUB_WORKSPACE/vendor/patches/ltw-minecraft-26.2.patch"
          chmod +x gradlew
          ./gradlew --no-daemon :ltw:assembleRelease
          AAR=ltw/build/outputs/aar/ltw-release.aar
          test -f "$AAR"
          VERIFY_DIR="$(mktemp -d)"
          unzip -q "$AAR" 'jni/arm64-v8a/libltw.so' -d "$VERIFY_DIR"
          readelf -Ws "$VERIFY_DIR/jni/arm64-v8a/libltw.so" | grep -q ' glGetFloatv$'
          readelf -Ws "$VERIFY_DIR/jni/arm64-v8a/libltw.so" | grep -q ' glGetBooleanv$'
          rm -rf "$VERIFY_DIR"

      - name: Check out pinned launch-engine source
        shell: bash
        run: |
          rm -rf .vendor-build/MojoLauncher
          mkdir -p .vendor-build
          git clone --filter=blob:none --no-checkout https://github.com/MojoLauncher/MojoLauncher.git .vendor-build/MojoLauncher
          cd .vendor-build/MojoLauncher
          git fetch --depth 1 origin "${{ steps.engine_lock.outputs.commit }}"
          git checkout --detach "${{ steps.engine_lock.outputs.commit }}"
          git submodule update --init --recursive --depth 1
          test "$(git rev-parse HEAD)" = "${{ steps.engine_lock.outputs.commit }}"

      - name: Build pinned native launch engine
        working-directory: .vendor-build/MojoLauncher
        shell: bash
        run: |
          git apply "$GITHUB_WORKSPACE/vendor/patches/mojo-single-destroy.patch"
          git apply "$GITHUB_WORKSPACE/vendor/patches/mojo-pointer-click-position.patch"
          chmod +x gradlew
          ./gradlew --no-daemon :app_pojavlauncher:assembleNoruntimeDebug

      - name: Cache downloaded runtimes and patched libraries
        uses: actions/cache@v4
        with:
          path: .engine-cache
          key: mclauncher-engine-${{ runner.os }}-${{ env.TARGET_ABI }}-${{ hashFiles('vendor/engine-lock.json', 'vendor/patches/*.patch') }}

      - name: Vendor engine, renderers, Java runtimes and patched LWJGL
        shell: bash
        run: |
          MOJO_APK=.vendor-build/MojoLauncher/app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk
          test -f "$MOJO_APK"
          python3 scripts/vendor_engine.py \
            --mojo-root .vendor-build/MojoLauncher \
            --mojo-apk "$MOJO_APK" \
            --ltw-root .vendor-build/LTW \
            --ltw-aar .vendor-build/LTW/ltw/build/outputs/aar/ltw-release.aar \
            --abis "$TARGET_ABI"
          python3 scripts/verify_bundled_engine.py --abis "$TARGET_ABI"

      - name: Set up MCLauncher Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore stable alpha debug signer
        if: env.PRIVATE_ACCOUNT_BUILD != 'true'
        shell: bash
        run: |
          mkdir -p .ci-signing
          base64 --decode signing/mclauncher-alpha-debug.jks.b64 > .ci-signing/mclauncher-alpha-debug.jks
          keytool -list \
            -keystore .ci-signing/mclauncher-alpha-debug.jks \
            -storepass mclauncher-alpha \
            -alias mclauncher-alpha

      - name: Restore private Microsoft-account signer
        if: env.PRIVATE_ACCOUNT_BUILD == 'true'
        shell: bash
        run: |
          test -n "$PRIVATE_SIGNING_KEY_BASE64" || { echo "Missing MCLAUNCHER_SIGNING_KEY_BASE64 secret"; exit 1; }
          test -n "$MCLAUNCHER_SIGNING_STORE_PASSWORD" || { echo "Missing MCLAUNCHER_SIGNING_STORE_PASSWORD secret"; exit 1; }
          test -n "$MCLAUNCHER_SIGNING_KEY_ALIAS" || { echo "Missing MCLAUNCHER_SIGNING_KEY_ALIAS secret"; exit 1; }
          test -n "$MCLAUNCHER_SIGNING_KEY_PASSWORD" || { echo "Missing MCLAUNCHER_SIGNING_KEY_PASSWORD secret"; exit 1; }
          mkdir -p .ci-signing
          printf '%s' "$PRIVATE_SIGNING_KEY_BASE64" | base64 --decode > .ci-signing/mclauncher-account.jks
          keytool -list \
            -keystore .ci-signing/mclauncher-account.jks \
            -storepass "$MCLAUNCHER_SIGNING_STORE_PASSWORD" \
            -alias "$MCLAUNCHER_SIGNING_KEY_ALIAS"

      - name: Build standalone MCLauncher APK
        shell: bash
        env:
          MCLAUNCHER_PRIVATE_ACCOUNTS: ${{ env.PRIVATE_ACCOUNT_BUILD }}
        run: gradle --no-daemon :app:assembleDebug -PmclauncherAbi="$TARGET_ABI"

      - name: Verify final APK payload
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ "$PRIVATE_ACCOUNT_BUILD" = "true" ]; then
            OUT=app/build/outputs/apk/debug/MCLauncher-11.0-alpha21-microsoft-${TARGET_ABI}.apk
          else
            OUT=app/build/outputs/apk/debug/MCLauncher-11.0-alpha21-${TARGET_ABI}.apk
          fi
          test -f "$APK"
          cp "$APK" "$OUT"
          unzip -t "$OUT" >/dev/null
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          unzip -q "$OUT" 'assets/bundled_engine/*' -d "$VERIFY_DIR"
          python3 scripts/verify_bundled_engine.py \
            --root "$VERIFY_DIR/assets/bundled_engine" \
            --abis "$TARGET_ABI"
          sha256sum "$OUT" | tee "${OUT}.sha256"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: MCLauncher-11.0-alpha21-${{ env.PRIVATE_ACCOUNT_BUILD == 'true' && 'microsoft-' || '' }}${{ env.TARGET_ABI }}
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/MCLauncher-11.0-alpha21-${{ env.TARGET_ABI }}.apk
            app/build/outputs/apk/debug/MCLauncher-11.0-alpha21-${{ env.TARGET_ABI }}.apk.sha256
            app/build/outputs/apk/debug/MCLauncher-11.0-alpha21-microsoft-${{ env.TARGET_ABI }}.apk
            app/build/outputs/apk/debug/MCLauncher-11.0-alpha21-microsoft-${{ env.TARGET_ABI }}.apk.sha256
            app/src/main/assets/bundled_engine/bundle-manifest.json
          if-no-files-found: error
